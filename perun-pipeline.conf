# This pipeline is designed to process Perun IdM audit log files.
#
# How to setup the timezone correctly:
# Timestamps in [perun][createdAt] have no zone, so the date filter below
# interprets them using the LOGSTASH_PIPELINE_TIMEZONE environment variable.
# If the variable is not set, it defaults to UTC (see the date filter's
# timezone => "${LOGSTASH_PIPELINE_TIMEZONE:UTC}" setting).
#
# Set it to any IANA zone name, e.g.:
#   export LOGSTASH_PIPELINE_TIMEZONE="Europe/Athens"
#   docker run -e LOGSTASH_PIPELINE_TIMEZONE="Europe/Athens" ...
#
# or in docker-compose:
#   environment:
#    - LOGSTASH_PIPELINE_TIMEZONE=Europe/Athens
# ---------------------------------------------------------------------------

# Get input from journald
input {
  journald {
    seekto => "head"
    filter => { syslog_identifier => "perun_audit"}
    thisboot => true
    sincedb_path => "/var/log/logstash/sincedb/sincedb_perun-audit"
  }
}
 
filter {
 
  # always fetch the json part of the log row
  grok {
    match => { "message" => "(?<MESSAGE>\{.*\})" }
  }
 
  # Get the json payload from journald's MESSAGE field
  json {
    source => "MESSAGE"
    target => "perun"
  }
 
  # truncate createdAt timestamp at milliseconds granularity which is enough
  mutate {
    gsub => [ "[perun][createdAt]", "(\.\d{3})\d+", "\1" ]
  }
 
  # Get the event's timestamp from event's createdAt field.
  # The timezone is given by env var LOGSTASH_PIPELINE_TIMEZONE - if not defined it defaults to UTC
  date {
    match => [
      "[perun][createdAt]",
      "yyyy-MM-dd HH:mm:ss.SSS",
      "yyyy-MM-dd HH:mm:ss"
    ]
    timezone => "${LOGSTASH_PIPELINE_TIMEZONE:UTC}"
    target => "@timestamp"
  }
 
 
  # Regex capture the event action from the java class name logged - store it as perun_action field
  if [perun][event][name] {
    grok {
      match => { "[perun][event][name]" => "\.(?<perun_action>[^.]+)$" }
    }
  }
 
  # Outcome heuristic: success unless the message says otherwise.
  mutate { add_field => { "outcome" => "success" } }
  if [perun][event][message] =~ /(fail(ed)?|error|denied)/ {
    mutate { replace => { "outcome" => "failure" } }
  }
 
  # Build the normalized audit record, then drop everything else.
  ruby {
    code => '
      ev   = event.get("[perun][event]") || {}
      user = ev["user"] || {}
      vo   = ev["vo"]
 
      subject_info = {}
      subject_info["internal_id"] = user["id"].to_s     if user["id"]
      subject_info["uuid"]        = user["uuid"]         if user["uuid"]
      subject_info["given_name"]  = user["firstName"]    if user["firstName"]
      subject_info["family_name"] = user["lastName"]     if user["lastName"]
      subject_info["name"]        = user["displayName"]  if user["displayName"]
 
      ctx = {}
      ctx["subject_info"] = subject_info unless subject_info.empty?
 
      # VO context (only present on VO events).
      if vo
        ctx["vo_info"] = {
          "id"        => vo["id"],
          "uuid"      => vo["uuid"],
          "name"      => vo["name"],
          "shortName" => vo["shortName"]
        }
      end
 
      audit_record = {
        "timestamp" => event.get("@timestamp").to_s,
        "subject"   => event.get("[perun][actor]"),
        "operation" => event.get("perun_action") || event.get("[perun][event][name]"),
        "outcome"   => event.get("outcome"),
        "source"    => "perun"
      }
      audit_record["object"]  = "vo:#{vo["name"] || vo["shortName"]}" if vo
      audit_record["context"] = ctx unless ctx.empty?
 
      # Replace the whole event with just the audit record fields.
      event.to_hash.keys.each { |k| event.remove(k) unless k.start_with?("@") }
      audit_record.each { |k, v| event.set(k, v) }
    '
  }
}
 
output {
  # Example output to console for verification
  # stdout {
  #   codec => rubydebug
  # }
 
  # Uncomment this block to output to an Elasticsearch/OpenSearch cluster.
  # Replace the 'hosts' and 'index' settings as needed for your environment.
  elasticsearch {
    hosts => ["http://localhost:9200"] # Change this to your Elasticsearch/OpenSearch host and port
    index => "perun-audit-%{+YYYY.MM.dd}" # The index name for your data
    # You can also add authentication if your cluster requires it
    # user => "elastic"
    # password => "changeme"
  }
}