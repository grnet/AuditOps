# Keycloak -> Accounting/Auditing Fluent Bit pipeline.
#
# Expected Keycloak setup:
#   - console logging in ECS JSON
#   - jboss-logging event listener enabled
#   - successful events logged at INFO
#
# This validation configuration prints the final Accounting/Auditing record to stdout.

[SERVICE]
    Flush           1
    Log_Level       info
    Parsers_File    /etc/fluent-bit/parsers.conf

# Read only the Keycloak systemd unit.
# Read_From_Tail avoids replaying the full journal on first start.
# DB persists the journal cursor between Fluent Bit restarts.
[INPUT]
    Name              systemd
    Tag               keycloak.live
    Systemd_Filter    _SYSTEMD_UNIT=keycloak.service
    Read_From_Tail    On
    DB                /etc/fluent-bit/db/keycloak_audit.db

# MESSAGE contains the ECS JSON emitted by Keycloak.
# Preserve_Key keeps the original MESSAGE for raw_log.
# Reserve_Data keeps journald/ECS metadata available to Lua.
[FILTER]
    Name          parser
    Match         keycloak.live
    Key_Name      MESSAGE
    Parser        keycloak_json
    Preserve_Key  On
    Reserve_Data  On

# Drops non-org.keycloak.events records and maps the rest to ENTRUST.
[FILTER]
    Name          lua
    Match         keycloak.live
    Script        /etc/fluent-bit/keycloak-audit.lua
    Call          map_event

# Validation output.
[OUTPUT]
    Name             stdout
    Match            keycloak.live
    Format           json_lines
    Json_Date_Key    false

# Production OpenSearch output example:
#
# [OUTPUT]
#     Name                  opensearch
#     Match                 keycloak.live
#     Host                  <OPENSEARCH_HOST>
#     Port                  443
#     HTTP_User             <USERNAME>
#     HTTP_Passwd           <PASSWORD>
#     Logstash_Format       On
#     Logstash_Prefix       entrust-keycloak-
#     Logstash_DateFormat   %Y-%m-%d
#     tls                   On
#     tls.verify            On
#     Suppress_Type_Name    On
