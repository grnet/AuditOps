[MULTILINE_PARSER]
    Name           inspektr_audit
    Type           regex
    Flush_Timeout  2000

    Rule  "start_state"  "/^}?[0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2},[0-9]+ INFO \[org\.apereo\.inspektr\.audit\.AuditTrailManager\].*Audit trail record BEGIN/"  "body"
    Rule  "body"          "/^(?!\}$).*/"  "body"
    Rule  "body"          "/^\}$/"        "start_state"


